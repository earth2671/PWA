<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#1976d2">

  <meta name="mobile-web-app-capable"
        content="yes">

  <meta name="apple-mobile-web-app-capable"
        content="yes">

  <meta name="apple-mobile-web-app-status-bar-style"
        content="default">

  <meta name="apple-mobile-web-app-title"
        content="Hosassist">

  <title>CheangYeun Hosassist</title>

  <!-- PWA -->
  <link rel="manifest"
        href="manifest.json">

  <!-- Browser icon -->
  <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="icon-192.png">

  <!-- iPhone -->
  <link rel="apple-touch-icon"
        href="icon-192.png">

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #ffffff;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;

      text-align: center;

      padding: 30px;
    }

    .logo {
      width: 130px;
      height: 130px;

      object-fit: contain;

      border-radius: 28px;

      margin-bottom: 20px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;

      color: #222;

      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;

      color: #777;

      margin-bottom: 25px;
    }

    .spinner {
      width: 45px;
      height: 45px;

      margin: auto;

      border: 4px solid #e5e5e5;
      border-top-color: #1976d2;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    .loading-text {
      margin-top: 18px;

      color: #777;

      font-size: 14px;
    }

    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <img
      src="icon-512.png"
      class="logo"
      alt="CheangYeun Hosassist">

    <div class="title">
      CheangYeun Hosassist
    </div>

    <div class="subtitle">
      ศูนย์ไตเทียม โรงพยาบาลเชียงยืน
    </div>

    <div class="spinner"></div>

    <div class="loading-text">
      กำลังเปิดระบบ...
    </div>

  </div>


  <!-- JavaScript -->
  <script src="app.js"></script>

</body>

</html>
